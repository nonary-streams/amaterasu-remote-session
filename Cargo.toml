[package]
name = "amaterasu-remote-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.amaterasu.standalone]
core-test-dependencies = ["amaterasu-state", "amaterasu-runtime"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["core-integration-tests"]
core-integration-tests = []

[dependencies]
amaterasu-module-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true

[dev-dependencies]
amaterasu-state = { path = "../state", features = ["test-support"] }
amaterasu-runtime = { path = "../../crates/runtime" }

[lints]
workspace = true
