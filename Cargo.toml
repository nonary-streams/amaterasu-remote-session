[package]
name = "amaterasu-remote-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nonary-streams/amaterasu-remote-session"
readme = "README.md"

[package.metadata.amaterasu.standalone]
core-test-dependencies = ["amaterasu-state", "amaterasu-runtime"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["core-integration-tests"]
core-integration-tests = []

[dependencies]
amaterasu-module-sdk = { path = "../../crates/module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
amaterasu-state = { path = "../state", features = ["test-support"] }
amaterasu-runtime = { path = "../../crates/runtime" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
